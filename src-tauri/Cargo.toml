[package]
name = "navforensics"
version = "2.0.0"
edition = "2021"
description = "NavForensics - lecture forensique des bases de navigateurs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
navforensics-engine = { path = "../engine" }

[features]
custom-protocol = ["tauri/custom-protocol"]
