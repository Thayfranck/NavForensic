[package]
name = "navforensics-engine"
version = "2.8.0"
edition = "2021"
description = "Coeur d'analyse forensique des bases de navigateurs (NavForensics)"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
plist = "1"
lz4_flex = "0.11"
flate2 = "1"
ese-core = "0.2"
ewf = "0.4"
ntfs-core = "0.10"
printpdf = "0.7"
regex = "1"
tempfile = "3"
rust_xlsxwriter = "0.79"
# Déchiffrement des identifiants Firefox (NSS : key4.db + logins.json)
aes = "0.8"
des = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
