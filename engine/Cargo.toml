[package]
name = "navforensics-engine"
version = "2.0.0"
edition = "2021"
description = "Coeur d'analyse forensique des bases de navigateurs (NavForensics)"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
plist = "1"
lz4_flex = "0.11"
flate2 = "1"
ese-core = "0.2"
printpdf = "0.7"
regex = "1"
tempfile = "3"
rust_xlsxwriter = "0.79"
